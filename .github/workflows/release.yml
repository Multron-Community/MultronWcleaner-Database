name: Release database

on:
  push:
    branches: [main]
    paths:
      - database.txt
      - release-notes/**
      - scripts/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate database
        run: node scripts/validate-database.js database.txt

      - name: Find latest release
        id: latest
        run: |
          name=$(gh release view --json name --jq .name 2>/dev/null || true)
          tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern database.txt --dir .previous || true
          fi

      - name: Prepare release
        id: plan
        env:
          LATEST_NAME: ${{ steps.latest.outputs.name }}
        run: node scripts/prepare-release.js --latest-name "$LATEST_NAME" --previous .previous/database.txt --out .release/body.md

      - name: Publish release
        if: steps.plan.outputs.skip == 'false'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release with tag $TAG already exists. Use a higher version in release-notes/."
            exit 1
          fi
          gh release create "$TAG" database.txt \
            --title "$TITLE" \
            --notes-file .release/body.md \
            --target "$GITHUB_SHA" \
            --latest
          echo "Published $TITLE: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
